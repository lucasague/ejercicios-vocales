<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ejercicios vocales</title>
<style>body{font-family:system-ui;margin:0;background:#16181d;color:#eee;padding:16px;max-width:560px;margin:auto}
h1{font-size:1.3rem}label{display:block;margin:12px 0 4px;color:#aaa;font-size:.9rem}select,input{width:100%;font-size:1rem;padding:8px;background:#23262d;color:#eee;border:1px solid #444;border-radius:8px}
.ej{background:#23262d;border-radius:12px;padding:12px;margin:10px 0}.ej b{display:block}.ej small{color:#9ab;word-break:break-word;display:block;margin:6px 0}
button{font-size:1rem;padding:10px 18px;border:0;border-radius:8px;background:#e8863a;color:#111;font-weight:600}button.stop{background:#555;color:#eee}
#nota{font-size:2rem;text-align:center;height:2.6rem;color:#e8863a}</style></head><body>
<h1>Ejercicios vocales</h1>
<p style="color:#aaa;font-size:.9rem">Master Class «Afina tu voz». Suena primero un acorde con tu nota de salida (Do), cuenta 4 pulsos y empieza el ejercicio.</p>
<label>Tono de salida (baja si se te hace agudo)</label>
<select id="tono"><option value="-7">Fa2... Fa3 (muy grave)</option><option value="-5" selected>Sol3 (grave)</option><option value="-3">La3</option><option value="0">Do4 (como la partitura)</option><option value="2">Re4</option><option value="4">Mi4</option></select>
<label>Velocidad: <span id="bv">72</span> pulsos/min</label><input id="bpm" type="range" min="40" max="140" value="72">
<div id="nota"></div><div id="lista"></div>
<script type="module">
import { EJERCICIOS, parsear } from './ejercicios.js';
const $ = id => document.getElementById(id); let ctx, parar = [];
$('bpm').oninput = () => $('bv').textContent = $('bpm').value;
function nota(f, t, d, v) {
  const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .02); g.gain.exponentialRampToValueAtTime(v * .4, t + d * .9); g.gain.linearRampToValueAtTime(0, t + d);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + d + .05); parar.push(o);
}
function parada() { parar.forEach(o => { try { o.stop() } catch {} }); parar = []; $('nota').textContent = ''; }
function tocar(txt) {
  parada(); ctx ??= new AudioContext(); ctx.resume();
  const tono = +$('tono').value, p = 60 / +$('bpm').value, f = s => 261.6256 * 2 ** ((s + tono) / 12);
  let t = ctx.currentTime + .2; [0, 4, 7].forEach(s => nota(f(s), t, 2 * p, .12)); t += 4 * p;
  for (const n of parsear(txt)) {
    nota(f(n.semis), t, n.pulsos * p * .95, .35);
    setTimeout(() => $('nota').textContent = n.silaba, (t - ctx.currentTime) * 1000); t += n.pulsos * p;
  }
  setTimeout(() => $('nota').textContent = '', (t - ctx.currentTime) * 1000);
}
$('lista').innerHTML = EJERCICIOS.map(([id, nom, txt], i) => `<div class="ej"><b>${nom}</b><small>${txt.replace(/:\d/g, '').replace(/ /g, ' · ')}</small><button data-i="${i}">▶ Tocar</button> <button class="stop">■</button></div>`).join('');
$('lista').onclick = e => { if (e.target.dataset.i) tocar(EJERCICIOS[e.target.dataset.i][2]); else if (e.target.classList.contains('stop')) parada(); };
</script></body></html>
