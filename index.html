<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ejercicios vocales</title>
<style>body{font-family:system-ui;margin:0;background:#16181d;color:#eee;padding:16px;max-width:560px;margin:auto}
h1{font-size:1.3rem}label{display:block;margin:12px 0 4px;color:#aaa;font-size:.9rem}select,input{box-sizing:border-box;width:100%;font-size:1rem;padding:8px;background:#23262d;color:#eee;border:1px solid #444;border-radius:8px}
.ej{background:#23262d;border-radius:12px;padding:12px;margin:10px 0}.ej b{display:block}.ej small{color:#9ab;word-break:break-word;display:block;margin:6px 0}
button{font-size:1rem;padding:10px 18px;border:0;border-radius:8px;background:#e8863a;color:#111;font-weight:600}button.stop{background:#555;color:#eee}
svg{width:100%;background:#f4efe4;border-radius:8px;margin:6px 0}.cur{fill:#e8863a}#nota{font-size:2rem;text-align:center;height:2.6rem;color:#e8863a}</style></head><body>
<h1>Ejercicios vocales</h1>
<p style="color:#aaa;font-size:.9rem">Master Class «Afina tu voz». Suena primero un acorde con tu nota de salida (Do), cuenta 4 pulsos y empieza el ejercicio.</p>
<label>Tono de salida (baja si se te hace agudo)</label>
<select id="tono"><option value="-7">Fa2... Fa3 (muy grave)</option><option value="-5" selected>Sol3 (grave)</option><option value="-3">La3</option><option value="0">Do4 (como la partitura)</option><option value="2">Re4</option><option value="4">Mi4</option></select>
<label>Velocidad: <span id="bv">72</span> pulsos/min</label><input id="bpm" type="range" min="40" max="140" value="72">
<label>Volumen</label><input id="vol" type="range" min="1" max="10" step="0.5" value="5">
<label style="display:flex;gap:8px;align-items:center;color:#eee"><input id="bucle" type="checkbox" checked style="width:auto"> Repetir en bucle hasta que pares (■)</label><div id="nota"></div>
<h2 style="font-size:1.1rem">Calentamiento</h2><div id="calent"></div>
<h2 style="font-size:1.1rem">Ejercicios</h2><div id="lista"></div>
<script type="module">
import { EJERCICIOS, parsear } from './ejercicios.js';
const SVGNS = 'http://www.w3.org/2000/svg';
// Pentagrama en clave de sol (escrito en Do, como la partitura); la nota que suena se pinta en naranja.
function pentagrama(i, notas) {
  const POR = 10, DX = 34, X0 = 40, ALTO = 120, filas = Math.ceil(notas.length / POR), W = X0 + POR * DX + 10;
  let s = `<svg viewBox="0 0 ${W} ${filas * ALTO}">`;
  for (let r = 0; r < filas; r++) {
    const y0 = r * ALTO + 70; // línea inferior (Mi4, pos 2)
    for (let l = 0; l < 5; l++) s += `<line x1="8" x2="${W - 6}" y1="${y0 - l * 8}" y2="${y0 - l * 8}" stroke="#333"/>`;
    s += `<text x="10" y="${y0 - 6}" font-size="46" fill="#333">𝄞</text>`;
  }
  notas.forEach((n, k) => {
    const r = Math.floor(k / POR), x = X0 + (k % POR) * DX + 14, y0 = r * ALTO + 70, y = y0 - (n.pos - 2) * 4;
    for (let p = 0; p >= n.pos; p -= 2) s += `<line x1="${x - 10}" x2="${x + 10}" y1="${y0 - (p - 2) * 4}" y2="${y0 - (p - 2) * 4}" stroke="#333"/>`;
    for (let p = 12; p <= n.pos; p += 2) s += `<line x1="${x - 10}" x2="${x + 10}" y1="${y0 - (p - 2) * 4}" y2="${y0 - (p - 2) * 4}" stroke="#333"/>`;
    if (n.alt) s += `<text x="${x - 19}" y="${y + 5}" font-size="15" fill="#333">${n.alt > 0 ? '♯' : '♭'}</text>`;
    s += `<ellipse id="n${i}_${k}" cx="${x}" cy="${y}" rx="6" ry="4.5" fill="${n.pulsos >= 2 ? '#f4efe4' : '#222'}" stroke="#222" stroke-width="1.6"/>`;
    s += `<text x="${x}" y="${y0 + 24}" font-size="10" text-anchor="middle" fill="#555">${n.silaba}</text>`;
  });
  return s + '</svg>';
}
// Calentamiento: audios de Juan (carpeta calentamiento/); para añadir uno, una línea aquí y el mp3 en la carpeta.
const CALENTAMIENTO = [['Lip Trill (hombre)', 'calentamiento/lip-trill-hombre.mp3']];
document.getElementById('calent').innerHTML = CALENTAMIENTO.map(([nom, src]) => `<div class="ej"><b>${nom}</b><audio controls preload="none" src="${src}" style="width:100%;margin-top:6px"></audio></div>`).join('');
const $ = id => document.getElementById(id); let ctx, parar = [], parpadeos = [];
$('bpm').oninput = () => $('bv').textContent = $('bpm').value;
// Piano de muestras (Salamander Grand Piano, A. Holm, CC-BY 3.0, vía tonejs.github.io): se usa la muestra más cercana y se ajusta el tono.
const MUESTRAS = { A2: 45, C3: 48, Ds3: 51, Fs3: 54, A3: 57, C4: 60, Ds4: 63, Fs4: 66, A4: 69, C5: 72, Ds5: 75 }, buffers = {};
async function cargar() {
  await Promise.all(Object.keys(MUESTRAS).map(async n => {
    if (buffers[n]) return;
    try { buffers[n] = await ctx.decodeAudioData(await (await fetch(`piano/${n}.mp3`)).arrayBuffer()); } catch {}
  }));
}
// Salida maestra: volumen ajustable (por defecto alto) y un compresor para que no sature.
let master;
function salida() {
  if (!master) { master = ctx.createGain(); const c = ctx.createDynamicsCompressor(); master.connect(c); c.connect(ctx.destination); }
  master.gain.value = +$('vol').value; return master;
}
$('vol').oninput = () => { if (master) master.gain.value = +$('vol').value; };
function nota(f, t, d, v) {
  const midi = 69 + 12 * Math.log2(f / 440);
  let mejor = null; for (const n in buffers) if (!mejor || Math.abs(MUESTRAS[n] - midi) < Math.abs(MUESTRAS[mejor] - midi)) mejor = n;
  const g = ctx.createGain(); g.connect(salida());
  const o = mejor ? ctx.createBufferSource() : ctx.createOscillator();
  if (mejor) { o.buffer = buffers[mejor]; o.playbackRate.value = 2 ** ((midi - MUESTRAS[mejor]) / 12); }
  else { o.type = 'triangle'; o.frequency.value = f; }
  g.gain.setValueAtTime(v * (mejor ? 2.2 : 1), t); g.gain.setValueAtTime(v * (mejor ? 2.2 : 1), t + d * .85); g.gain.linearRampToValueAtTime(0, t + d + .25);
  o.connect(g); o.start(t); o.stop(t + d + .3); parar.push(o);
}
function parada() { parpadeos.forEach(clearTimeout); document.querySelectorAll('.cur').forEach(e => e.classList.remove('cur')); parar.forEach(o => { try { o.stop() } catch {} }); parar = []; $('nota').textContent = ''; }
async function tocar(txt, ej) {
  parada(); ctx ??= new AudioContext(); await ctx.resume(); await cargar();
  pasada(txt, ej, true);
}
// Una pasada del ejercicio (con acorde y cuenta solo la primera vez); si el bucle está activo, encadena otra hasta que se pare.
function pasada(txt, ej, primera) {
  const tono = +$('tono').value, p = 60 / +$('bpm').value, f = s => 261.6256 * 2 ** ((s + tono) / 12);
  let t = ctx.currentTime + .2;
  if (primera) { [0, 4, 7].forEach(s => nota(f(s), t, 2 * p, .12)); t += 4 * p; } else t += p;
  parsear(txt).forEach((n, k) => {
    nota(f(n.semis), t, n.pulsos * p * .95, .35);
    parpadeos.push(setTimeout(() => {
      document.querySelectorAll('.cur').forEach(e => e.classList.remove('cur'));
      $('nota').textContent = n.silaba; const e = $(`n${ej}_${k}`); e.classList.add('cur'); e.scrollIntoView({ block: 'nearest' });
    }, (t - ctx.currentTime) * 1000)); t += n.pulsos * p;
  });
  const hasta = (t - ctx.currentTime) * 1000;
  parpadeos.push(setTimeout(() => { parpadeos = []; $('bucle').checked ? pasada(txt, ej, false) : parada(); }, hasta));
}
$('lista').innerHTML = EJERCICIOS.map(([id, nom, txt], i) => `<div class="ej"><b>${nom}</b><div class="pent" id="p${i}"></div><button data-i="${i}">▶ Tocar</button> <button class="stop">■</button></div>`).join('');
EJERCICIOS.forEach(([, , txt], i) => $('p' + i).innerHTML = pentagrama(i, parsear(txt)));
$('lista').onclick = e => { if (e.target.dataset.i) tocar(EJERCICIOS[e.target.dataset.i][2], +e.target.dataset.i); else if (e.target.classList.contains('stop')) parada(); };
</script></body></html>
